<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Callout: one short phrase or number that punches in mid-video, then clears. Filled by app/motion.py (PARAMS). -->
<style>
  @font-face { font-family: Hook; src: url("font.ttf"); font-weight: 800; }
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #root { position: relative; }
  .card { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
  .text { font-family: Hook, sans-serif; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #fff;
          padding: 0.14em 0.34em 0.18em; border-radius: 0.18em; text-transform: uppercase; opacity: 0;
          text-shadow: 0 0.05em 0.2em rgba(0, 0, 0, 0.35); }
</style>
</head>
<body>
<div id="root" data-composition-id="callout" data-start="0" data-width="__W__" data-height="__H__" data-duration="__DUR__">
  <div class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"><div class="card"><div class="text"></div></div></div>
</div>
<script src="gsap.min.js"></script>
<script>
  const P = /*PARAMS*/null;
  const root = document.getElementById("root"), clip = root.firstElementChild;
  const size = Math.round(Math.min(P.w * 0.12, P.h * 0.12));
  Object.assign(root.style, { width: P.w + "px", height: P.h + "px", fontSize: size + "px" });
  const card = clip.querySelector(".card"), text = clip.querySelector(".text");
  card.style.top = Math.round(P.h * 0.3) + "px";
  text.textContent = P.text;
  text.style.background = P.accent;
  // punch in past full size and settle, hold, then drop out fast: a beat, not a slide
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(text, { opacity: 0, scale: 0.6, rotation: -4 },
            { opacity: 1, scale: 1, rotation: -2, duration: 0.28, ease: "back.out(2.6)" }, 0)
    .to(text, { opacity: 0, scale: 0.92, y: size * 0.3, duration: 0.22, ease: "power2.in" }, P.duration - 0.25);
  window.__timelines = window.__timelines || {};
  window.__timelines.callout = tl;
</script>
</body>
</html>
